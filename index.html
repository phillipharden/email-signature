<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Victory Church Signature</title>

<link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
/>

<style>
    :root {
        color-scheme: light only;
        supported-color-schemes: light only;
    }
</style>
</head>

<body
    bgcolor="#ffffff"
    style="
        margin:0;
        padding:20px;
        background:#ffffff;
        background-color:#ffffff;
    "
>

<div style="background:#ffffff; background-color:#ffffff;">

<table
    bgcolor="#ffffff"
    cellpadding="0"
    cellspacing="0"
    border="0"
    style="
        width:720px;
        max-width:720px;
        background:#ffffff;
        background-color:#ffffff;
        border-radius:22px;
        font-family:Arial, Helvetica, sans-serif;
    "
>

<tr>

    <!-- LEFT COLUMN -->
    <td
        bgcolor="#ffffff"
        style="
            width:240px;
            padding:28px 20px;
            vertical-align:top;
            background:#ffffff;
            background-color:#ffffff;
        "

        <img
            src="./images/pic.png"
            alt="Phillip Harden"
            width="100%"
            height="auto"
            style="
                display:block;
                border-radius:50%;
            "
        />

    <!-- RIGHT COLUMN -->
    <td

        style="
            padding:28px 30px 28px 0;
            vertical-align:top;
            background:#ffffff;
            background-color:#ffffff;
        "

        <!-- NAME -->
        <div
            style="
                font-size:42px;
                line-height:46px;
                font-weight:700;
                color:#000000;
                -webkit-text-fill-color:#000000;
            "

            Phillip Harden

        <!-- TITLE -->
        <div
            style="
                font-size:24px;
                line-height:30px;
                color:#000000;
                -webkit-text-fill-color:#000000;

                background-color:#ffffff;

            <tr>

                <td
                    bgcolor="#ffffff"
                    style="
                        padding:6px 12px 6px 0;
                        background:#ffffff;
                        background-color:#ffffff;
                        color:#000000;
                        width:30px;
                    "
                >
                    <i
                        class="fa-solid fa-envelope"

                            font-size:24px;
                            color:#000000;
                            line-height:24px;
                        "

                <td
                    bgcolor="#ffffff"

                        font-size:24px;
                        line-height:30px;
                        color:#000000;
                        -webkit-text-fill-color:#000000;

                        background-color:#ffffff;
                    "
                >
                    <a
                        href="mailto:pharden@victoryatl.com"
                        target="_blank"
                        style="
                            color:#000000;
                            -webkit-text-fill-color:#000000;
                            text-decoration:none;
                        "
                    >
                        pharden@victoryatl.com
                    </a>
                </td>

            </tr>

            <!-- PHONE -->
            <tr>

                <td
                    bgcolor="#ffffff"
                    style="
                        padding:6px 12px 6px 0;
                        background:#ffffff;
                        background-color:#ffffff;
                        color:#000000;
                        width:30px;
                    "
                >
                    <i
                        class="fa-solid fa-phone"
                        style="
                            font-size:24px;
                            color:#000000;
                            line-height:24px;
                        "
                    ></i>
                </td>

                <td
                    bgcolor="#ffffff"
                    style="
                        font-size:24px;
                        line-height:30px;
                        color:#000000;
                        -webkit-text-fill-color:#000000;
                        background:#ffffff;
                        background-color:#ffffff;
                    "
                >
                    <a
                        href="tel:+14704502833"
                        style="
                            color:#000000;
                            -webkit-text-fill-color:#000000;
                            text-decoration:none;
                        "
                    >
                        470-450-2833
                    </a>
                </td>

            </tr>

            <!-- WEBSITE -->
            <tr>

                <td
                    bgcolor="#ffffff"
                    style="
                        padding:6px 12px 6px 0;
                        background:#ffffff;
                        background-color:#ffffff;
                        color:#000000;
                        width:30px;
                    "
                >
                    <i
                        class="fa-solid fa-globe"
                        style="
                            font-size:24px;
                            color:#000000;
                            line-height:24px;
                        "

                    bgcolor="#ffffff"

                        font-size:24px;
                        line-height:30px;

            </tr>

                background:#d8d8d8;
                background-color:#d8d8d8;
                margin:22px 0 18px;
            "
        ></div>

        <img
            src="./images/logo.png"
            alt="Victory Church"
            width="330"
            style="
                display:block;
                width:330px;
                max-width:330px;
                height:auto;
                border:0;
            "

</tr>

</table>

</html>
